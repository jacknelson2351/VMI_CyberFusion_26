<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PixelVault - Fast, free image hosting">
    <title>PixelVault - Upload and share images</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand">
                <i data-lucide="image" class="nav-icon"></i>
                <span>PixelVault</span>
            </a>
            <div class="nav-links">
                <a href="/gallery" class="nav-link">
                    <i data-lucide="layout-grid"></i>
                    <span>Gallery</span>
                </a>
                
                <a href="/login" class="nav-link">
                    <i data-lucide="log-in"></i>
                    <span>Login</span>
                </a>
                <a href="/register" class="nav-link btn-primary">
                    <i data-lucide="user-plus"></i>
                    <span>Register</span>
                </a>
                
            </div>
        </div>
    </nav>

    <main class="main-content">
        
<section class="hero">
    <h1>Share your images with the world</h1>
    <p class="hero-sub">Drag, drop, or paste. No account required.</p>
</section>

<section class="upload-section">
    <form id="upload-form" action="/upload" method="post" enctype="multipart/form-data">
        <div id="drop-zone" class="drop-zone">
            <i data-lucide="upload-cloud" class="drop-icon"></i>
            <p class="drop-text">Drag images here or click to browse</p>
            <p class="drop-hint">Paste from clipboard with Ctrl+V</p>
            <input type="file" id="file-input" name="files" multiple accept="image/*" class="file-input">
        </div>

        <div id="preview-area" class="preview-area hidden"></div>

        <div class="upload-options">
            <div class="form-group">
                <label for="title">
                    <i data-lucide="type"></i> Title (optional)
                </label>
                <input type="text" id="title" name="title" placeholder="Give your upload a title" maxlength="255">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="visibility">
                        <i data-lucide="eye"></i> Visibility
                    </label>
                    <select id="visibility" name="visibility">
                        <option value="public">Public</option>
                        <option value="unlisted">Unlisted</option>
                        <option value="private">Private</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="nsfw" value="true">
                        <i data-lucide="alert-triangle"></i> NSFW
                    </label>
                </div>
            </div>
            <button type="submit" id="upload-btn" class="btn btn-primary btn-lg" disabled>
                <i data-lucide="upload"></i>
                <span>Upload</span>
            </button>
        </div>
    </form>
</section>



    </main>

    <footer class="footer">
        <div class="footer-container">
            <p>PixelVault &middot; Free image hosting</p>
            <div class="footer-links">
                <a href="/api/v1/health">API</a>
            </div>
        </div>
    </footer>

    <script>lucide.createIcons();</script>
    
<script src="/static/js/upload.js"></script>

</body>
</html>
