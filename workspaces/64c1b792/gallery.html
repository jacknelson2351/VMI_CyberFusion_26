<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PixelVault - Fast, free image hosting">
    <title>Gallery - PixelVault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand">
                <i data-lucide="image" class="nav-icon"></i>
                <span>PixelVault</span>
            </a>
            <div class="nav-links">
                <a href="/gallery" class="nav-link">
                    <i data-lucide="layout-grid"></i>
                    <span>Gallery</span>
                </a>
                
                <a href="/login" class="nav-link">
                    <i data-lucide="log-in"></i>
                    <span>Login</span>
                </a>
                <a href="/register" class="nav-link btn-primary">
                    <i data-lucide="user-plus"></i>
                    <span>Register</span>
                </a>
                
            </div>
        </div>
    </nav>

    <main class="main-content">
        
<section class="gallery-section">
    <div class="gallery-header">
        <h1><i data-lucide="layout-grid"></i> Gallery</h1>
        <div class="sort-tabs">
            <a href="/gallery?sort=newest" class="sort-tab active">
                <i data-lucide="clock"></i> Newest
            </a>
            <a href="/gallery?sort=top" class="sort-tab ">
                <i data-lucide="trending-up"></i> Top
            </a>
            <a href="/gallery?sort=trending" class="sort-tab ">
                <i data-lucide="flame"></i> Trending
            </a>
        </div>
    </div>

    
    <div class="empty-state">
        <i data-lucide="image-off" class="empty-icon"></i>
        <p>No images yet. Be the first to <a href="/">upload one</a>!</p>
    </div>
    
</section>

    </main>

    <footer class="footer">
        <div class="footer-container">
            <p>PixelVault &middot; Free image hosting</p>
            <div class="footer-links">
                <a href="/api/v1/health">API</a>
            </div>
        </div>
    </footer>

    <script>lucide.createIcons();</script>
    
</body>
</html>
